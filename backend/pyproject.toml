[project]
name = "psychology-roulette"
version = "0.1.0"
description = "Authoritative game engine and API for Psychology Roulette"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic>=2.11,<3",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/psychology_roulette"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
